[project]
name = "obsidian-mcp"
version = "2.0.0"
description = "MCP server for accessing an opinionated Obsidian vault"
authors = [
    { name = "vic Garcia", email = "vic.garcia@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-env>=0.8.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["obsidian_mcp_test.py"]
python_functions = ["test_*"]
addopts = ["-v"]
env = [
    "OBSIDIAN_VAULT_PATH = tests/fixtures/vault"
]
